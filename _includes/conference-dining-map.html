<div class="conference-map-frame">
  <div
    class="conference-map conference-dining-map"
    id="conference-dining-map"
    role="region"
    aria-label="Interactive map of dining options in L'Aquila"
    data-map-zoom="{{ conference.dining.zoom | default: 17 }}">
    <p class="conference-map-status">Interactive dining map loading&hellip;</p>
  </div>
  <noscript><p class="conference-map-noscript">The interactive map requires JavaScript. All dining options are listed below.</p></noscript>
</div>

<script type="application/json" id="conference-dining-data">{{ conference.dining.places | jsonify }}</script>

<div class="conference-dining-list" aria-label="Dining options">
  {% for place in conference.dining.places %}
    <article class="conference-dining-card" id="dining-{{ place.id }}">
      <span class="conference-dining-number" aria-hidden="true">{{ place.marker_label }}</span>
      <div class="conference-dining-copy">
        <h2>{{ place.name }}</h2>
        <p class="conference-dining-address">{{ place.address }}<br>{{ place.postal }}</p>
        {% if place.note %}<p class="conference-dining-note">{{ place.note }}</p>{% endif %}
        <div class="conference-dining-actions">
          <button type="button" class="conference-dining-show-on-map" data-place-id="{{ place.id }}" hidden>Show on map</button>
          <a href="{{ place.directions_url }}" target="_blank" rel="noopener noreferrer">Open directions</a>
        </div>
      </div>
    </article>
  {% endfor %}
</div>
