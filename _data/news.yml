- category: Events
  date: "2026-10-26"
  title: "Good luck Sara with new adventures!"
  text: "Farewell dinner for Sara, who is leaving for her first postdoc in Davide Gerosa’s group at the University of Milano-Bicocca. I was there in spirit, enjoying the company! It has been an intense four-year journey, full of extreme (mass-ratio) and enriching moments. I look forward to meeting you again as a colleague. A bright future awaits you! And don’t forget to invite your friends (me) when you organize meetings in cool places!"
