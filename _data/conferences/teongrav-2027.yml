about:
  - TEONGRAV is the INFN network of scientists studying the theory and phenomenology of gravitational waves, modelling gravitational-wave sources such as black holes and neutron stars. The network includes twelve local units (Roma, Milano Bicocca, Pisa, Firenze, Torino, Cagliari, Trieste-SISSA, Trento-TIFPA, Padova, Napoli, Perugia and GSSI).
  - The annual TEONGRAV meeting of 2027 will take place at the Gran Sasso Science Institute in L'Aquila from 9 to 11 February 2027. The meeting will start on Tuesday 9 February and end on Thursday 11 February.
  - The primary objective of the meeting is to foster connections among scientists from the different TEONGRAV units. We particularly encourage younger members to engage in exchanges of ideas and discussions regarding the diverse research activities within the TEONGRAV network.

