about:
  - The 2027 meeting of the <a class="conference-address" href="https://www.lisamission.org/" target="_blank" rel="noopener">LISA Consortium</a> will take place at the Gran Sasso Science Institute in L'Aquila from 5 to 8 July 2027.
  - The meeting features a programme dedicated to discussing the gravitational wave science of the LISA Consortium, and allows members of the Working Groups to interact and share their research results.

